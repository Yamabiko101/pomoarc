[package]
name = "pomolife"
version = "0.1.0"
edition = "2021"
description = "A lively Pomodoro TUI for focus sessions."
license = "MIT"
repository = "https://github.com/Yamabiko101/pomoarc"

[[bin]]
name = "pomolife"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "5.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.13"
